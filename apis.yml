aid: playco
name: Playco
description: >-
  Playco is an instant-play gaming company founded in 2020 by Justin Waldron, Michael Carter, Takeshi Otsuka and
  Teddy Cross, headquartered in Tokyo with teams worldwide. It builds HTML5 games that run inside social and
  communication platforms without an app install — EverWing on Facebook, Snake Squad on Snap Games, Heads Up! for
  Zoom, Sway Stories on TikTok and Trip Royale on LINE — and reached unicorn status on a $100M Series A. Its
  technology stack, described on play.co/tech, is developer tooling rather than a public web API: PixiJS (the
  open-source HTML5 rendering/creation engine it acquired with Goodboy Digital in 2021), Odie3D (a 3D extension
  framework), GCInstant (a client-side JavaScript library wrapping platform SDKs and analytics) and Replicant (a
  backend-as-a-service state manager for instant games). Playco publishes no developer portal, no API reference and
  no machine-readable contract; its public code surface is the play-co GitHub organization, which is the renamed
  Game Closure organization and carries the legacy devkit HTML5 game platform, js.io and ff.
